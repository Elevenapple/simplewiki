server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Preserve the public host and port when running behind Docker or a proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = / {
        return 302 /simplewiki/;
    }

    location /simplewiki/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Same-origin diagram rendering, forwarded to the plantuml compose service.
    # Resolving the name lazily via Docker's embedded DNS lets nginx start (and the
    # rest of the site work) even when the plantuml service is not running.
    location /plantuml/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $plantuml_upstream plantuml;
        rewrite ^/plantuml/(.*)$ /$1 break;
        proxy_pass http://$plantuml_upstream:8080;
    }

    error_page 404 /simplewiki/404.html;
}
