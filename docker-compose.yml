services:
  simplewiki:
    build: .
    image: simplewiki:latest
    ports:
      - "8080:80"
    depends_on:
      - plantuml
    restart: unless-stopped

  # Local PlantUML renderer. The built site reaches it same-origin via the nginx
  # /plantuml/ proxy; the published 8081 port is only for `bun run dev`, whose
  # default renderer URL is http://localhost:8081.
  plantuml:
    image: plantuml/plantuml-server:jetty
    ports:
      - "8081:8080"
    restart: unless-stopped
